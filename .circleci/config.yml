          name: Begin verify
          command: |
            sed -n '/./p' /tmp/job-05/MVI_00007984 2>/dev/null | wc -l || true
      - run:
          name: Pull repository
          command: git clone --depth 2 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar -I bzip2 -xf output.tar.bz2
      - run:
