            echo "footprint: $(wc -c </tmp/job-05/MVI_00007984)"
      - persist_to_workspace:
          root: /tmp/job-05
          paths:
            - 'MVI_00007984'
  succes-only-13:
    machine:
      image: ubuntu-2204:current
